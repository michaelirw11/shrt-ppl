<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Berhadiah</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a, #1e3a8a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .screen {
      text-align: center;
      width: 100%;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
      transition: 0.2s;
      background: #2563eb;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    canvas {
      background: #081229;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(96,165,250,0.3);
    }

    img {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #60a5fa;
      margin-bottom: 20px;
    }

    h1 {
      color: #93c5fd;
    }

    .big {
      font-size: 50px;
      font-weight: bold;
      color: #60a5fa;
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <!-- SLIDE 1 -->
  <div class="screen" id="slide1">
    <h1>🎮 Game Berhadiah</h1>
    <p>Apakah kamu mau menyelesaikan game ini?</p>

    <button onclick="mulaiGame()">Yes</button>
    <button onclick="alert('Harus mau 😤')">No</button>
  </div>

  <!-- SLIDE 2 -->
  <div class="screen" id="slide2" style="display:none;">
    <h1>Hancurkan Semua Block!</h1>
    <p>Kalau berhasil baru lanjut 😎</p>

    <canvas id="gameCanvas" width="700" height="400"></canvas>
  </div>

  <!-- SLIDE 3 -->
  <div class="screen" id="slide3" style="display:none;">
    <h1>Pertanyaan Urgenttt</h1>

    <p style="font-size:28px;">Apakah kamu pendek?</p>

    <button onclick="jawabYes()">Yes 😔</button>
    <button id="noBtn">No 😤</button>
  </div>

  <!-- SLIDE 4 -->
  <div class="screen" id="slide4" style="display:none;">
    <img src="yis.jpg" alt="yis">

    <div class="big">AKU PENDEKKKKK 🤏😂</div>
  </div>

<script>
  function mulaiGame() {
    document.getElementById('slide1').style.display = 'none';
    document.getElementById('slide2').style.display = 'block';
    startBreakout();
  }

  function jawabYes() {
    document.getElementById('slide3').style.display = 'none';
    document.getElementById('slide4').style.display = 'block';
  }

  const noBtn = document.getElementById('noBtn');

  noBtn.addEventListener('mouseover', () => {
    const x = Math.random() * 500 - 250;
    const y = Math.random() * 300 - 150;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  function startBreakout() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let ballRadius = 10;
    let x = canvas.width / 2;
    let y = canvas.height - 30;
    let dx = 4;
    let dy = -4;

    let paddleHeight = 10;
    let paddleWidth = 130;
    let paddleX = (canvas.width - paddleWidth) / 2;

    let rightPressed = false;
    let leftPressed = false;

    const brickRowCount = 2;
    const brickColumnCount = 7;
    const brickWidth = 75;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 30;

    let bricks = [];

    for(let c=0; c<brickColumnCount; c++) {
      bricks[c] = [];
      for(let r=0; r<brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }

    document.addEventListener('keydown', keyDownHandler);
    document.addEventListener('keyup', keyUpHandler);

    // CONTROL HP / TOUCHSCREEN
    document.addEventListener('touchmove', touchHandler, { passive: false });

    function keyDownHandler(e) {
      if(e.key == 'Right' || e.key == 'ArrowRight') {
        rightPressed = true;
      }
      else if(e.key == 'Left' || e.key == 'ArrowLeft') {
        leftPressed = true;
      }
    }

    function keyUpHandler(e) {
      if(e.key == 'Right' || e.key == 'ArrowRight') {
        rightPressed = false;
      }
      else if(e.key == 'Left' || e.key == 'ArrowLeft') {
        leftPressed = false;
      }
    }

    function touchHandler(e) {
      e.preventDefault();

      const touchX = e.touches[0].clientX;
      const rect = canvas.getBoundingClientRect();
      const relativeX = touchX - rect.left;

      if(relativeX > 0 && relativeX < canvas.width) {
        paddleX = relativeX - paddleWidth / 2;
      }
    }
      else if(e.key == 'Left' || e.key == 'ArrowLeft') {
        leftPressed = false;
      }
    }

    function collisionDetection() {
      let remaining = 0;

      for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
          let b = bricks[c][r];

          if(b.status == 1) {
            remaining++;

            if(x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
              dy = -dy;
              b.status = 0;
              remaining--;

              if(remaining === 0) {
                document.getElementById('slide2').style.display = 'none';
                document.getElementById('slide3').style.display = 'block';
              }
            }
          }
        }
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI*2);
      ctx.fillStyle = '#60a5fa';
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      for(let c=0; c<brickColumnCount; c++) {
        for(let r=0; r<brickRowCount; r++) {
          if(bricks[c][r].status == 1) {
            let brickX = (c*(brickWidth+brickPadding))+brickOffsetLeft;
            let brickY = (r*(brickHeight+brickPadding))+brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;

            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBricks();
      drawBall();
      drawPaddle();
      collisionDetection();

      if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) {
        dx = -dx;
      }

      if(y + dy < ballRadius) {
        dy = -dy;
      }
      else if(y + dy > canvas.height-ballRadius) {
        if(x > paddleX && x < paddleX + paddleWidth) {
          dy = -dy;
        }
        else {
          document.location.reload();
        }
      }

      if(rightPressed && paddleX < canvas.width-paddleWidth) {
        paddleX += 7;
      }
      else if(leftPressed && paddleX > 0) {
        paddleX -= 7;
      }

      x += dx;
      y += dy;

      requestAnimationFrame(draw);
    }

    draw();
  }
</script>

</body>
</html>

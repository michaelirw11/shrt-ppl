<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Berhadiah</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  overflow:hidden;
  background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
  color:white;
  height:100vh;
}

.screen{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  color:#93c5fd;
  margin-bottom:15px;
}

p{
  margin-bottom:20px;
  font-size:20px;
}

button{
  padding:14px 24px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:18px;
  margin:10px;
  cursor:pointer;
}

button:active{
  transform:scale(0.95);
}

canvas{
  background:#081229;
  border-radius:20px;
  box-shadow:0 0 25px rgba(96,165,250,0.4);
  max-width:95vw;
}

img{
  width:250px;
  height:250px;
  border-radius:50%;
  object-fit:cover;
  border:6px solid #60a5fa;
  margin-bottom:20px;
}

.bigtext{
  font-size:48px;
  font-weight:bold;
  color:#60a5fa;
  animation:shake .4s infinite;
}

#noBtn{
  position:relative;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}
</style>
</head>
<body>

<!-- SLIDE 1 -->
<div class="screen" id="slide1">
  <h1>🎮 Game Berhadiah 🎮</h1>
  <p>Apakah kamu mau menyelesaikan game ini?</p>

  <div>
    <button onclick="startGame()">Yes</button>
    <button onclick="paksa()">No</button>
  </div>
</div>

<!-- SLIDE 2 -->
<div class="screen" id="slide2" style="display:none;">
  <h1>Hancurkan Semua Blocknyaaa!</h1>
  <p>Geser jari/kursor untuk gerakin paddle</p>

  <canvas id="canvas" width="700" height="400"></canvas>
</div>

<!-- SLIDE 3 -->
<div class="screen" id="slide3" style="display:none;">
  <h1>Pertanyaan Penting</h1>

  <p style="font-size:30px;">Apakah kamu pendek?</p>

  <div>
    <button onclick="jawabYes()">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<!-- SLIDE 4 -->
<div class="screen" id="slide4" style="display:none;">
  <img src="yis.jpg">

  <div class="bigtext">AKU PENDEKKKKK 🤏😂</div>
</div>

<script>
function paksa(){
  alert('Harus mau 😤');
}

function startGame(){
  document.getElementById('slide1').style.display='none';
  document.getElementById('slide2').style.display='flex';
  initGame();
}

function jawabYes(){
  document.getElementById('slide3').style.display='none';
  document.getElementById('slide4').style.display='flex';
}

const noBtn=document.getElementById('noBtn');

noBtn.addEventListener('mouseenter',kabur);
noBtn.addEventListener('touchstart',kabur);

function kabur(){
  const x=Math.random()*200-100;
  const y=Math.random()*120-60;

  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
}

function initGame(){
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

let ballX=canvas.width/2;
let ballY=canvas.height-30;
let dx=4;
let dy=-4;
let radius=10;

let paddleHeight=12;
let paddleWidth=130;
let paddleX=(canvas.width-paddleWidth)/2;

const rows=2;
const cols=7;
const brickWidth=80;
const brickHeight=20;
const padding=10;
const topOffset=30;
const leftOffset=25;

let bricks=[];

for(let c=0;c<cols;c++){
  bricks[c]=[];
  for(let r=0;r<rows;r++){
    bricks[c][r]={x:0,y:0,status:1};
  }
}

function drawBall(){
  ctx.beginPath();
  ctx.arc(ballX,ballY,radius,0,Math.PI*2);
  ctx.fillStyle='#60a5fa';
  ctx.fill();
  ctx.closePath();
}

function drawPaddle(){
  ctx.beginPath();
  ctx.rect(paddleX,canvas.height-paddleHeight,paddleWidth,paddleHeight);
  ctx.fillStyle='#2563eb';
  ctx.fill();
  ctx.closePath();
}

function drawBricks(){
  for(let c=0;c<cols;c++){
    for(let r=0;r<rows;r++){
      if(bricks[c][r].status===1){
        let brickX=(c*(brickWidth+padding))+leftOffset;
        let brickY=(r*(brickHeight+padding))+topOffset;

        bricks[c][r].x=brickX;
        bricks[c][r].y=brickY;

        ctx.beginPath();
        ctx.rect(brickX,brickY,brickWidth,brickHeight);
        ctx.fillStyle='#3b82f6';
        ctx.fill();
        ctx.closePath();
      }
    }
  }
}

function collision(){
  let remaining=0;

  for(let c=0;c<cols;c++){
    for(let r=0;r<rows;r++){
      let b=bricks[c][r];

      if(b.status===1){
        remaining++;

        if(ballX>b.x && ballX<b.x+brickWidth && ballY>b.y && ballY<b.y+brickHeight){
          dy=-dy;
          b.status=0;
          remaining--;

          if(remaining===0){
            document.getElementById('slide2').style.display='none';
            document.getElementById('slide3').style.display='flex';
          }
        }
      }
    }
  }
}

canvas.addEventListener('mousemove',movePaddle);
canvas.addEventListener('touchmove',moveTouch,{passive:false});

function movePaddle(e){
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  paddleX=x-paddleWidth/2;
}

function moveTouch(e){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const x=e.touches[0].clientX-rect.left;
  paddleX=x-paddleWidth/2;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawBricks();
  drawBall();
  drawPaddle();
  collision();

  if(ballX+dx>canvas.width-radius || ballX+dx<radius){
    dx=-dx;
  }

  if(ballY+dy<radius){
    dy=-dy;
  }else if(ballY+dy>canvas.height-radius){

    if(ballX>paddleX && ballX<paddleX+paddleWidth){
      dy=-dy;
    }else{
      alert('Coba lagi deqqqqzzz');
      document.location.reload();
    }
  }

  ballX+=dx;
  ballY+=dy;

  requestAnimationFrame(draw);
}

draw();
}
</script>

</body>
</html>
